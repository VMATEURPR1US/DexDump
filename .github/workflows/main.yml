name: Build Zygisk DexDump

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ github.token }}

      - name: Add JitPack repository for ZygoteLoader
        run: |
          # Принудительно прописываем репозиторий с плагином в settings.gradle перед сборкой
          sed -i '/repositories {/a \        maven { url "https://jitpack.io" }' settings.gradle
          sed -i '/repositories {/a \        maven { url "https://sonatype.org" }' settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :module:assembleRelease --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DexDump-Zygisk-Module
          path: module/build/outputs/apk/release/*.apk
